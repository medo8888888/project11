<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bright — Settings</title>
    <style>
      body {
        max-width: 420px;
        margin: 40px auto;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        color: #111827;
      }
      h1 {
        font-size: 16px;
        margin-bottom: 4px;
      }
      p {
        font-size: 13px;
        color: #6b7280;
        margin-top: 0;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        margin-bottom: 6px;
        color: #374151;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 11px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 12px;
      }
      button {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      #status {
        margin-left: 10px;
        font-size: 12px;
        color: #059669;
      }
    </style>
  </head>
  <body>
    <h1>Bright extension settings</h1>
    <p>The web app this extension opens project codes against.</p>
    <label for="baseUrl">Base URL</label>
    <input id="baseUrl" type="url" placeholder="https://bright.alkashafqatar.com" />
    <button id="save">Save</button>
    <span id="status"></span>
    <script src="shared.js"></script>
    <script src="options.js"></script>
  </body>
</html>
